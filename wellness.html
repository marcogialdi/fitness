<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script></head>
<body><script>
Page.init({
  title:"Wellness", sub:"Sonno e recupero (RingConn).",
  kpis:[
    {"title": "Sleep score", "source": "sonno", "color": "#ec4899", "kind": "avg7", "dec": 0},
    {"title": "Ore di sonno", "source": "ore_sonno", "color": "#38bdf8", "kind": "avg7", "unit": "h"},
    {"title": "Debito di sonno", "color": "#fb923c", "calc": "debito", "unit": "h", "note": "7 gg vs obiettivo"},
    {"title": "Regolarità addormentamento", "color": "#facc15", "calc": "regol", "unit": "min", "dec": 0, "note": "dev. standard 14 gg (più basso = meglio)"},
    {"title": "HRV", "source": "hrv", "color": "#4ade80", "kind": "avg7", "unit": "ms", "dec": 0},
    {"title": "HRV vs baseline", "color": "#4ade80", "calc": "hrvb", "unit": "%", "dec": 1, "note": "media 7 gg vs 60 gg"},
    {"title": "FC a riposo", "source": "fc_riposo", "color": "#fb923c", "kind": "avg7", "unit": "bpm", "dec": 0},
    {"title": "Efficienza sonno", "source": "efficienza", "color": "#38bdf8", "kind": "avg7", "unit": "%", "dec": 0},
    {"title": "Sonno profondo", "source": "deep", "color": "#ec4899", "kind": "avg7", "unit": "%"},
    {"title": "REM", "source": "rem", "color": "#2dd4bf", "kind": "avg7", "unit": "%"},
    {"title": "Temperatura cutanea", "source": "temp", "color": "#facc15", "kind": "avg7", "unit": "°C"},
    {"title": "SpO₂", "source": "spo2", "color": "#38bdf8", "kind": "avg7", "unit": "%", "dec": 0},
    {"title": "Passi", "source": "passi", "color": "#4ade80", "kind": "avg7", "dec": 0}],
  charts:[
    {"type": "line", "title": "Sleep score", "label": "Sleep score", "source": "sonno", "color": "#ec4899"},
    {"type": "line", "title": "Ore di sonno", "label": "Ore", "source": "ore_sonno", "color": "#38bdf8"},
    {"type": "line", "title": "HRV", "label": "HRV (ms)", "source": "hrv", "color": "#4ade80"},
    {"type": "line", "title": "Frequenza cardiaca a riposo", "label": "bpm", "source": "fc_riposo", "color": "#fb923c"},
    {"type": "line", "title": "Efficienza del sonno", "label": "Efficienza (%)", "source": "efficienza", "color": "#38bdf8"},
    {"type": "line", "title": "Sonno profondo", "label": "Profondo (%)", "source": "deep", "color": "#ec4899"},
    {"type": "line", "title": "REM", "label": "REM (%)", "source": "rem", "color": "#2dd4bf"},
    {"type": "line", "title": "Temperatura cutanea", "label": "°C", "source": "temp", "color": "#facc15"},
    {"type": "line", "title": "SpO₂", "label": "SpO₂ (%)", "source": "spo2", "color": "#38bdf8"},
    {"type": "bar", "title": "Passi", "label": "Passi", "source": "passi", "agg": "avg", "color": "#4ade80"},
    {"type": "scatter", "title": "Correlazione: sleep score vs volume allenamento del giorno dopo", "label": "Giorni", "x": "sonno", "y": "volume", "yagg": "sum", "lag": 1, "color": "#ec4899", "xl": "Sleep score (notte precedente)", "yl": "Volume (kg)"},
    {"type": "scatter", "title": "Correlazione: HRV vs volume allenamento del giorno dopo", "label": "Giorni", "x": "hrv", "y": "volume", "yagg": "sum", "lag": 1, "color": "#4ade80", "xl": "HRV (giorno prima)", "yl": "Volume (kg)"}]
});
</script></body></html>
