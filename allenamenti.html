<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script></head>
<body><script>
Page.init({
  title:'Allenamenti', sub:'Volume, durata e frequenza delle sessioni.',
  kpis:[
    {title:'Ultimo volume sessione',source:'volume',unit:'kg',dec:0,color:'#facc15'},
    {title:'Ultima durata',source:'durata',unit:'min',dec:0,color:'#38bdf8'}],
  charts:[
    {type:'bar',wide:true,title:'Volume per sessione (kg)',label:'Volume (kg)',source:'volume',agg:'sum',color:'#facc15'},
    {type:'bar',title:'Durata allenamenti (min)',label:'Minuti',source:'durata',agg:'sum',color:'#38bdf8'},
    {type:'bar',title:'Numero di sessioni',label:'Sessioni',source:'sessioni',agg:'sum',color:'#4ade80'}]
});
</script></body></html>
