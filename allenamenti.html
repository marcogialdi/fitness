<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fitness">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/sources.js"></script><script src="assets/help.js"></script><script src="assets/app.js"></script><script src="assets/pwa.js" defer></script></head>
<body><script>
Page.init({
  title:"Allenamenti", sub:"Frequenza, volume e carico delle sessioni.",
  kpis:[
    {"title": "Sessioni a settimana", "color": "#4ade80", "calc": "sess", "dec": 1, "note": "media 28 gg"},
    {"title": "Volume settimanale", "color": "#facc15", "calc": "volsett", "unit": "kg", "dec": 0, "note": "media 28 gg"},
    {"title": "Giorni dall'ultimo allenamento", "color": "#fb923c", "calc": "giorni", "dec": 0},
    {"title": "Streak settimane", "color": "#4ade80", "calc": "streak", "dec": 0, "note": "obiettivo sessioni/sett. raggiunto"},
    {"title": "Carico acuto/cronico", "color": "#ec4899", "calc": "acwr", "dec": 2, "note": "7 gg / media 28 gg (ideale ~0.8–1.3)"},
    {"title": "Record personali (30 gg)", "color": "#facc15", "calc": "pr", "dec": 0, "note": "esercizi chiave con nuovo 1RM stimato"}],
  charts:[
    {"type": "bar", "title": "Volume per sessione (kg)", "label": "Volume (kg)", "source": "volume", "agg": "sum", "color": "#facc15", "wide": true},
    {"type": "groups", "title": "Volume per gruppo muscolare (ultimi 28 gg)", "label": "Volume (kg)", "color": "#2dd4bf", "days": 28},
    {"type": "bar", "title": "Numero di sessioni", "label": "Sessioni", "source": "sessioni", "agg": "sum", "color": "#4ade80"},
    {"section": "Dettagli allenamento", "note": "durata, serie, densità e 1RM stimato degli esercizi chiave", "collapsed": true, "kpis": [{"title": "Ultimo volume sessione", "color": "#facc15", "unit": "kg", "dec": 0, "source": "volume"}, {"title": "Ultima durata", "color": "#38bdf8", "unit": "min", "dec": 0, "source": "durata"}, {"title": "Densità allenamento", "color": "#38bdf8", "calc": "dens", "unit": "kg/min", "dec": 0, "note": "28 gg"}, {"lifts": true, "title": "1RM stimato {l}", "unit": "kg", "dec": 1}]},
    {"type": "bar", "title": "Durata allenamenti (min)", "label": "Minuti", "source": "durata", "agg": "sum", "color": "#38bdf8"},
    {"type": "bar", "title": "Serie totali (no warm-up)", "label": "Serie", "source": "serie", "agg": "sum", "color": "#fb923c"},
    {"lifts": true, "type": "line", "title": "1RM stimato – {l}", "label": "kg", "agg": "max"}]
});
</script></body></html>
