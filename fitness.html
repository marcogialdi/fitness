<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/sources.js"></script><script src="assets/app.js"></script></head>
<body><script>
Page.init({
  title:"Fitness", sub:"Composizione corporea (BIA).",
  kpis:[
    {"title": "Peso attuale", "source": "peso", "color": "#38bdf8", "unit": "kg", "dec": 2},
    {"title": "Massa grassa", "source": "grasso", "color": "#fb923c", "unit": "%"},
    {"title": "Massa magra (LBM)", "source": "lbm", "color": "#2dd4bf", "unit": "kg"},
    {"title": "Massa muscolare", "source": "muscolo", "color": "#4ade80", "unit": "kg"},
    {"title": "Acqua corporea", "source": "acqua", "color": "#38bdf8", "unit": "%"},
    {"title": "Grasso viscerale", "source": "visc", "color": "#fb923c", "dec": 0},
    {"title": "Metabolismo basale", "source": "bmr", "color": "#facc15", "unit": "kcal", "dec": 0},
    {"title": "Età corporea", "source": "eta_met", "color": "#ec4899", "unit": "anni", "dec": 0},
    {"title": "SMI", "source": "smi", "color": "#4ade80", "dec": 2},
    {"title": "Body score", "source": "score", "color": "#ec4899", "dec": 0},
    {"title": "Rapporto muscolo/grasso", "color": "#4ade80", "calc": "mg", "dec": 2, "note": "ultimi valori"},
    {"title": "FFMI", "color": "#2dd4bf", "calc": "ffmi", "note": "indice massa magra"}],
  charts:[
    {"type": "line", "title": "Peso", "label": "Peso (kg)", "source": "peso", "color": "#38bdf8"},
    {"type": "line", "title": "Massa grassa", "label": "Massa grassa (%)", "source": "grasso", "color": "#fb923c"},
    {"type": "line", "title": "Massa magra (LBM)", "label": "LBM (kg)", "source": "lbm", "color": "#2dd4bf"},
    {"type": "line", "title": "Massa muscolare", "label": "Muscolo (kg)", "source": "muscolo", "color": "#4ade80"},
    {"type": "line", "title": "Acqua corporea", "label": "Acqua (%)", "source": "acqua", "color": "#38bdf8"},
    {"type": "line", "title": "Grasso viscerale", "label": "Viscerale", "source": "visc", "color": "#fb923c"},
    {"type": "line", "title": "Metabolismo basale", "label": "BMR (kcal)", "source": "bmr", "color": "#facc15"},
    {"type": "line", "title": "Età corporea", "label": "Anni", "source": "eta_met", "color": "#ec4899"},
    {"type": "line", "title": "SMI", "label": "SMI", "source": "smi", "color": "#4ade80"},
    {"type": "line", "title": "Body score", "label": "Score", "source": "score", "color": "#ec4899"}]
});
</script></body></html>
